services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://lead_agent:lead_agent@db:5432/lead_agent
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://lead_agent:lead_agent@db:5432/lead_agent
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m app.worker"]

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lead_agent
      POSTGRES_USER: lead_agent
      POSTGRES_PASSWORD: lead_agent
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lead_agent -d lead_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ollama-data:
  postgres-data:
