[project]
name = "lead-agent"
version = "0.1.0"
description = "Production-grade local sales agent for The Social Girl"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "beautifulsoup4>=4.12,<5.0",
  "alembic>=1.14,<2.0",
  "google-api-python-client>=2.150,<3.0",
  "google-auth-httplib2>=0.2,<1.0",
  "google-auth-oauthlib>=1.2,<2.0",
  "httpx>=0.27,<1.0",
  "openai-agents>=0.22,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
